map $args $basketvision_entry {
    "" /index.html;
    default /private.html;
}
map $request_uri $basketvision_robots {
    default "noindex, nofollow";
    "/" "index, follow";
    ~^/assets/ "";
    "/favicon.svg" "";
    "/robots.txt" "";
    "/sitemap.xml" "";
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10g;
    add_header X-Robots-Tag $basketvision_robots always;
    location = / { try_files $basketvision_entry =404; }
    location = /index.html { return 301 /$is_args$args; }
    location = /private.html { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /private.html; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
