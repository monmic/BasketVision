server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10g;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
