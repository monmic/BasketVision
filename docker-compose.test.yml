services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: basketvision_tests
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d basketvision_tests"]
      interval: 2s
      timeout: 5s
      retries: 20
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      TEST_DATABASE_URL: Host=test-db;Database=basketvision_tests;Username=test;Password=test
    depends_on:
      test-db:
        condition: service_healthy
